<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>OK Hub - 통합 판매관리</title>
<meta name="description" content="9개 사업자 통합 판매관리 시스템">
<meta name="theme-color" content="#ffab73">

<!-- favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23ffd9b3'/><stop offset='100%25' stop-color='%23ff9966'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><circle cx='50' cy='50' r='14' fill='white' opacity='0.95'/><circle cx='50' cy='50' r='6' fill='%23ff9966'/><circle cx='25' cy='25' r='4' fill='white' opacity='0.7'/><circle cx='75' cy='25' r='4' fill='white' opacity='0.7'/><circle cx='25' cy='75' r='4' fill='white' opacity='0.7'/><circle cx='75' cy='75' r='4' fill='white' opacity='0.7'/></svg>">

<!-- PWA -->
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ffab73'/><circle cx='50' cy='50' r='14' fill='white'/><circle cx='50' cy='50' r='6' fill='%23ffab73'/></svg>">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  background: #ffab73;
}

/* 스플래시 화면 */
#splash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #ffcc99 0%, #ffab73 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; transition: opacity 0.5s ease-out;
}
#splash.fade-out { opacity: 0; pointer-events: none; }

.splash-logo {
  width: 100px; height: 100px; border-radius: 22px; background: #ffd9b3;
  display: flex; align-items: center; justify-content: center; position: relative;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
  animation: pulse 1.5s ease-in-out infinite;
}
.splash-logo .center { 
  width: 32px; height: 32px; border-radius: 50%; background: #fff; position: absolute;
  box-shadow: 0 0 0 6px rgba(255, 171, 115, 0.5);
}
.splash-logo .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff9966; position: absolute; z-index: 2; }
.splash-logo .c1 { position: absolute; top: 14px; left: 14px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.85); }
.splash-logo .c2 { position: absolute; top: 14px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.85); }
.splash-logo .c3 { position: absolute; bottom: 14px; left: 14px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.85); }
.splash-logo .c4 { position: absolute; bottom: 14px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.85); }

.splash-title {
  margin-top: 28px; font-size: 36px; color: #fff; letter-spacing: 2px; font-weight: 500;
}
.splash-title .hub { color: #fff5e6; margin-left: 8px; }
.splash-sub {
  margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.9); letter-spacing: 1px; font-weight: 400;
}

.loading-dots { margin-top: 32px; display: flex; gap: 6px; }
.loading-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.7);
  animation: bounce 1.4s ease-in-out infinite both;
}
.loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.loading-dots span:nth-child(2) { animation-delay: -0.16s; }
.loading-dots span:nth-child(3) { animation-delay: 0s; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* iframe */
#app-frame {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  border: 0; background: #fff;
}
</style>
</head>
<body>

<!-- 스플래시 화면 -->
<div id="splash">
  <div class="splash-logo">
    <div class="center"></div>
    <div class="dot"></div>
    <span class="c1"></span>
    <span class="c2"></span>
    <span class="c3"></span>
    <span class="c4"></span>
  </div>
  <div class="splash-title">OK<span class="hub">Hub</span></div>
  <div class="splash-sub">통합 판매관리 시스템</div>
  <div class="loading-dots">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- 실제 앱 (iframe으로 GAS 웹앱 임베드) -->
<iframe id="app-frame" 
        src="https://script.google.com/macros/s/AKfycbwKY_OlgEOkmTQhJWPciq9mlp13bTT49uIw6KKI3yCfXaQE3mClJo2EzSnxHOA0P50y0w/exec"
        allow="clipboard-read; clipboard-write; fullscreen"></iframe>

<script>
// iframe 로딩 완료 시 스플래시 사라짐
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('splash').classList.add('fade-out');
    setTimeout(function() {
      document.getElementById('splash').style.display = 'none';
    }, 500);
  }, 1500); // 최소 1.5초 스플래시 보임
});

// 페이지 제목/아이콘 유지
document.title = 'OK Hub - 통합 판매관리';
</script>

</body>
</html>
